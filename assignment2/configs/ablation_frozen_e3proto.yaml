# Clean frozen-vs-unfrozen ablation
# ResNet-50 with a frozen backbone under the SAME optimization protocol as E3.
# The only intended difference from configs/pretrained.yaml is freeze_backbone.
# Run on a single GPU so hardware is held constant.

seed: 42

data:
  root: data/food-101
  image_size: 224
  num_classes: 101
  train_split: train
  val_ratio: 0.1
  test_split: test

model:
  name: resnet50
  num_classes: 101
  pretrained: true
  freeze_backbone: true
  dropout: 0.2

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine

evaluation:
  metrics:
    - accuracy
    - macro_f1

output:
  checkpoint_dir: checkpoints/ablation_frozen_e3proto
  result_dir: results/ablation_frozen_e3proto
